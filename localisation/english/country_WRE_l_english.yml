 WRE_institutional_legitimacy:0 "Institutional Legitimacy"
 WRE_institutional_legitimacy_desc:0 "The Frankfurt Republic is battered, poor and humiliated, but it remains the only German government with a plausible claim to legal continuity. Civil servants, courts and local authorities still answer its letters, and in a broken Germany that matters."
 WRE_bundestag:0 "Bundestag"
 WRE_bundestag_desc:0 "Low turnout and national humiliation have not killed parliamentary life in Frankfurt. The Bundestag gives the centrist coalition a forum, a ritual of legality and a fragile argument that Germany can still be governed by ballots rather than street armies."
 WRE_military_shadow:0 "The military shaddow"
 WRE_military_shadow_desc:0 "The treaty limited the army, but it did not erase the officer corps, the veterans or the men who believe Germany was betrayed rather than defeated. Their influence reaches into ministries, police forces and patriotic clubs, waiting for weakness."
 WRE_hyperinflation:0 "Hyperinflation"
 WRE_hyperinflation_desc:0 "Reparations, lost industry and wartime debt have broken the mark. Wages become worthless between paydays, savings disappear overnight, and every attempt to govern is poisoned by the simple question of what money is still worth."
 WRE_treaty_of_westfallia:0 "The treaty of Westfallia"
 WRE_treaty_of_westfallia_desc:0 "The peace tore the Rhineland from Germany, neutered eastern ambitions, limited the army and buried the republic beneath impossible obligations. Until the German lands are reunited, the treaty remains the chain around Frankfurt's throat."
 WRE_germany_divided:0 "Germany divided"
 WRE_germany_divided_desc:0 "Germany no longer speaks with one voice. Freikorps militarists, socialist revolutionaries, separatists and neutral zones all claim pieces of the fallen eagle, and every border inside Germany is also an argument over what Germany should become."
