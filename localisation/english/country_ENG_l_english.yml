 ENG_royal_act_of_national_security_and_sovereignty:0 "The Royal Act of National Security and Sovereignty"
 ENG_royal_act_of_national_security_and_sovereignty_desc:0 "Passed in the panic after revolution consumed Paris and Germany broke apart, the Royal Act dissolved normal parliamentarian rule in the name of national survival. To its supporters it is the shield of Britain; to its enemies it is a crown-backed coup in legal dress."
 ENG_oswald_mosley:0 "Oswald Mosley"
 ENG_oswald_mosley_desc:0 "Young, decorated and dangerously persuasive, Oswald Mosley speaks to a country tired of old parties and frightened by the red tide. His Promethean movement promises discipline, rebirth and a third path between market liberalism and labour politics."
 ENG_anti_communist_watchdogs:0 "Anti-communist watchdogs"
 ENG_anti_communist_watchdogs_desc:0 "With Europe burning, London arms friendly officers, monarchists and reactionary movements wherever communism threatens to take root. These watchdogs buy Britain time, but they also bind the empire to foreign clients, dirty wars and permanent suspicion."
 ENG_axis_of_reaction:0 "The Axis of Reaction"
 ENG_axis_of_reaction_desc:0 "Britain has gathered a chain of anti-communist clients and allies into a hard defensive system. Access, guarantees and military coordination hold the line abroad while the crown insists that no red regime can be allowed to stand uncontested."
 ENG_ira_activity:0 "IRA Activity"
 ENG_ira_activity_desc:0 "Ireland remains a wound in the imperial system. Raids, clandestine cells and sympathetic local networks force London to keep soldiers and police tied down at home while the wider empire demands attention abroad."
 ENG_empire_is_crumbling:0 "Empire is Crumbling"
 ENG_empire_is_crumbling_desc:0 "The royal dictatorship, left-wing exiles and fears of lost autonomy have shaken the dominions and colonies. Canada and other imperial possessions watch London closely, wondering whether loyalty still serves them or merely chains them to a collapsing center."
 ENG_overextension:0 "Overextension"
 ENG_overextension_desc:0 "Britain emerged from the war with prestige, ships and enemies, but also with an unbearable bill. Naval commitments, White Russian support, overseas garrisons and anti-communist containment now stretch the empire beyond what its exhausted institutions can comfortably sustain."
