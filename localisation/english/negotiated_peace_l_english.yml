l_english:
 ee_negotiated_peace:0 "Negotiated Settlements"
 ee_negotiated_peace_desc:0 "Wars do not always need to end in total collapse. Exhausted enemies can be offered terms based on the territory already in our hands."
 EE_offer_negotiated_settlement:0 "Offer Peace to [From.GetNameDef]"
 EE_offer_negotiated_settlement_desc:0 "[From.GetNameDefCap] is close enough to defeat that we can propose a limited settlement. If they accept, we will take states they own which we currently control and either core or claim, then sign a white peace."
 ee_negotiated_peace.1.t:0 "Peace Terms from [From.GetNameDef]"
 ee_negotiated_peace.1.d:0 "[From.GetNameDefCap] has offered to end the war through a negotiated settlement. They demand recognition of the territory they currently control and have a core or claim on. Accepting would end this war with a limited transfer of territory rather than continued fighting."
 ee_negotiated_peace.1.a:0 "Accept the settlement"
 ee_negotiated_peace.1.b:0 "Reject the terms"
 ee_negotiated_peace.2.t:0 "Settlement Accepted"
 ee_negotiated_peace.2.d:0 "[From.GetNameDefCap] has accepted our negotiated peace terms. The claimed territory under our control has been transferred to us, and the war has ended."
 ee_negotiated_peace.2.a:0 "A limited victory"
 ee_negotiated_peace.3.t:0 "Settlement Rejected"
 ee_negotiated_peace.3.d:0 "[From.GetNameDefCap] has rejected our peace terms. The war continues."
 ee_negotiated_peace.3.a:0 "Then the guns keep speaking"
