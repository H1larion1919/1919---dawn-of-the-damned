 HEL_1919_election_campaign:0 "The 1919 Election Campaign"
 HEL_1919_election_campaign_desc:0 "The regional races are counted proportionally into one national result. A majority in the fifty-seat parliament requires twenty-six seats.\n\n§ROpposition [?HEL_opposition_campaign_support|0]%§!  [GetHELElectionSupportChart]  §GOur Coalition [?HEL_total_campaign_support|0]%§!\n\nProjected strength: §Y[?HEL_election_seats|0] of 50 seats§!\n\nEvery region has its own demands. Larger commitments buy substantially more support, but ambitious promises may alienate voters elsewhere. The opposition counter-campaigns every three days."
