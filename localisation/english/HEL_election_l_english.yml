 HEL_campaign_epirus:0 "Campaign in Epirus"
 HEL_campaign_epirus_desc:0 "Visit Epirus and contest its four parliamentary seats."
 HEL_campaign_thessaly:0 "Campaign in Thessaly"
 HEL_campaign_thessaly_desc:0 "Address the agricultural crisis in Thessaly and contest its six seats."
 HEL_campaign_attica:0 "Campaign in Attica"
 HEL_campaign_attica_desc:0 "Athens and Attica command ten seats and the country's political press."
 HEL_campaign_morea:0 "Campaign in the Morea"
 HEL_campaign_morea_desc:0 "Carry the campaign through the Morea and contest its five seats."
 HEL_campaign_islands:0 "Campaign in the Islands"
 HEL_campaign_islands_desc:0 "Cross the Aegean and eastern Mediterranean to contest four island seats."
 HEL_campaign_macedonia:0 "Campaign in Macedonia"
 HEL_campaign_macedonia_desc:0 "Macedonia commands ten seats and remains central to the National Schism."
 HEL_campaign_eastern_thrace:0 "Campaign in Eastern Thrace"
 HEL_campaign_eastern_thrace_desc:0 "Defend the settlement in Eastern Thrace and contest its three seats."
 HEL_campaign_constantinople:0 "Campaign in Constantinople"
 HEL_campaign_constantinople_desc:0 "Speak to the electorate of the Queen of Cities and contest its three seats."
 HEL_campaign_marmara:0 "Campaign around the Marmara"
 HEL_campaign_marmara_desc:0 "Tour the new Marmara territories and contest their three seats."
 HEL_campaign_ionia:0 "Campaign in Ionia"
 HEL_campaign_ionia_desc:0 "Visit the exposed Ionian possessions and contest their two seats."
 HEL_address_agriculture:0 "Address Agriculture"
 HEL_address_agriculture_desc:0 "Promise credit, land reform and relief to the struggling farmers of Thessaly."
 HEL_address_overextension:0 "Address Imperial Overextension"
 HEL_address_overextension_desc:0 "Explain how Greece can defend an empire spanning the Mediterranean, Aegean and Black Sea."
 HEL_address_political_freedom:0 "Address Political Freedom"
 HEL_address_political_freedom_desc:0 "Commit the next government to dismantling wartime controls and personal rule."
 HEL_address_national_schism:0 "Address the National Schism"
 HEL_address_national_schism_desc:0 "Offer a settlement between Venizelists, republicans and the supporters of the exiled crown."
 HEL_address_war_exhaustion:0 "Address War Exhaustion"
 HEL_address_war_exhaustion_desc:0 "Promise that demobilisation will finally return soldiers and economic life to peace."
 HEL_plastiras_countdown:0 "The Conspiracy Must Act"
 HEL_plastiras_countdown_desc:0 "The authorities are drawing closer. Plastiras must reach fifty preparation points and seize the government before his network is exposed."
 HEL_plastiras_court_liberal_deputies:0 "Court Liberal Deputies"
 HEL_plastiras_court_liberal_deputies_desc:0 "Spend five days convincing Venizelist deputies that the army alone can preserve the Ethnarch's settlement. Their support will come with conditions."
 HEL_plastiras_rally_officers:0 "Rally the Officer Corps"
 HEL_plastiras_rally_officers_desc:0 "Spend six days using political and command influence to secure the loyalty of veteran officers. They will expect guarantees in return."
 HEL_plastiras_secure_telegraph:0 "Secure the Telegraph Offices"
 HEL_plastiras_secure_telegraph_desc:0 "Spend four days placing trusted men around the country's communications. Telegraph workers will demand protection or immunity."
 HEL_plastiras_prepare_athens_garrison:0 "Prepare the Athens Garrison"
 HEL_plastiras_prepare_athens_garrison_desc:0 "Spend seven days ensuring the capital's barracks will move when Plastiras gives the order. The garrison will name its price."
 HEL_plastiras_launch_coup:0 "Launch the Coup d'État"
 HEL_plastiras_launch_coup_desc:0 "The necessary deputies, officers and communications are in place. The army can now preserve Venizelos' legacy by force."

 hel_election.1.t:0 "The 1919 Greek Election"
 hel_election.1.d:0 "Venizelos had secured a larger Greece, but the victory had been bought with personal freedoms, a cult of personality and almost a decade of war. The Ethnarch now retired from crisis government with Greek soldiers standing in Thrace, Ionia, Constantinople and along the Black Sea. Demobilisation had begun, yet much of the economy remained trapped beneath requisitions, military contracts and emergency controls. The fiscal situation was strained and the agricultural districts of Thessaly were suffering from labour shortages, debt and exhausted land. Greece had forged an empire but had not decided how to afford it. Withdrawal could surrender the settlement won by so much blood, while maintaining garrisons across the Mediterranean, Aegean and Black Sea threatened permanent overextension. Voters had many reasons to praise the Liberal establishment. It had defeated Greece's enemies, enlarged the state and made the Megali Idea tangible. They also had many reasons to oppose it. Parliament had withered beneath emergency rule, political enemies had been intimidated and nearly every household had paid for Venizelos' triumph."
 hel_election.1.a:0 "Zaimis shall defend a republican Greece."
 hel_election.1.b:0 "Gounaris shall rally the royalist opposition."
 hel_election.2.t:0 "Who Shall Inherit the Ethnarch's Greece?"
 hel_election.2.d:0 "Venizelos will not lead the Liberal establishment into another election. Alexandros Zaimis offers a cautious republican settlement, a controlled dismantling of the emergency state and continuity abroad. Dimitrios Gounaris gathers the royalists, conservatives and opponents of the wartime order behind a direct challenge to Liberal rule. Greece must choose which civilian coalition will carry the campaign."
 hel_election.2.a:0 "Zaimis shall defend a republican Greece."
 hel_election.2.b:0 "Gounaris shall rally the royalist opposition."
 hel_election.2.c:0 "Plastiras must preserve the victory."
 hel_election.3.t:0 "The Zaimis–Plastiras Correspondence"
 hel_election.3.d:0 "Plastiras remained an experienced soldier, a devoted Venizelist and a man with enough influence in the barracks to overturn a civilian ministry. He asked Zaimis whether the republic would remain popular and energetic or retreat from the territorial settlement beneath parliamentary caution. Zaimis understood that he required the general's loyalty until the ballots were counted, but every concession strengthened a man who might eventually dispense with ballots entirely."
 hel_election.3.a:0 "A popular republic requires decisive soldiers."
 hel_election.3.b:0 "Promise reformist solidarity—and keep him on a leash."
 hel_election.4.t:0 "The Freethinkers' Assembly"
 hel_election.4.d:0 "The royalist opposition had united against Venizelos but agreed upon little else. Metaxas demanded a radical reaction against the republic, an assertive state and the political mobilisation of the officer corps. Gounaris instead defended an authoritarian parliament, civilian party government and a controlled restoration of constitutional order. The assembly would decide not merely its electoral language but the direction in which the entire opposition would continue to move."
 hel_election.4.a:0 "Shift Right — give Metaxas the convention floor."
 hel_election.4.b:0 "Shift Left — Gounaris must retain control."
 hel_election.4.c:0 "Bind both wings to Gounaris."
 hel_election.5.t:0 "The Death of Ion Dragoumis"
 hel_election.5.d:0 "Ion Dragoumis was killed by Venizelist paramilitaries and the murder immediately became another wound in the National Schism. Royalists compared his death to the exile of the monarchy and accused the Liberal state of replacing law with partisan violence. Republicans feared that condemning Venizelos' machinery would alienate their guaranteed electorate and invite Plastiras to act, while defending it would confirm every accusation of personal rule."
 hel_election.5.a:0 "His death proves the violence of the republican settlement."
 hel_election.5.b:0 "Mourn him without reopening the old schism."
 hel_election.5.c:0 "The republic must renounce Venizelos' cult of personality."
 hel_election.5.f:0 "Defend the settlement, whatever its excesses."
 hel_election.5.e:0 "The army condemns the murder and prepares to restore order."
 hel_election.20.t:0 "Greece Goes to the Polls"
 hel_election.20.d:0 "Polling stations opened from Epirus to Ionia while soldiers guarded the new territories and party agents watched the count. The campaign was over. Greece would now discover whether the victors of the war could also survive the judgement of peace."
 hel_election.20.a:0 "Count every ballot."
 hel_election.21.t:0 "Zaimis Secures a Parliamentary Majority"
 hel_election.21.d:0 "The republican campaign secured at least twenty-six seats. Zaimis could now dismantle the emergency state without repudiating the territorial settlement, though Plastiras and the old Venizelist machine would watch every concession."
 hel_election.21.a:0 "A parliamentary republic shall govern Greece."
 hel_election.22.t:0 "Gounaris Secures a Parliamentary Majority"
 hel_election.22.d:0 "The royalist opposition secured at least twenty-six seats. Gounaris inherited an enlarged but exhausted country and the dangerous task of reconciling the exiled monarchy with territories won beneath Venizelist arms."
 hel_election.22.a:0 "The Liberal establishment has been defeated."
 hel_election.23.t:0 "Plastiras Seizes Athens"
 hel_election.23.d:0 "The telegraph offices were occupied before dawn, trusted officers surrounded the ministries and Liberal deputies announced an emergency directorate. Plastiras claimed that civilian hesitation threatened everything Greece had won and that the army would preserve the national settlement until political life could be purified."
 hel_election.23.a:0 "The army shall preserve Venizelos' Greece."
 hel_election.24.t:0 "The Plastiras Conspiracy Fails"
 hel_election.24.d:0 "The conspirators moved too cautiously. Police uncovered the correspondence, wavering deputies withdrew and several officers refused to march without clearer orders. Plastiras' intervention collapsed before it could seize Athens, leaving Zaimis to restore civilian authority over a shaken republic."
 hel_election.24.a:0 "The barracks will answer to parliament."
 hel_election.40.t:0 "The Agricultural Crisis in Thessaly"
 hel_election.40.desc:0 "Thessaly's farmers had lost labourers to the army, carried debts accumulated during wartime requisition and worked land whose equipment had scarcely changed in a generation. Epirus shared much of the poverty, though not its great estates. A modest promise would be affordable. A serious programme could transform the countryside, but urban workers and southern landowners would ask why they must pay for it."
 hel_election.40.a:0 "Establish rural credit cooperatives."
 hel_election.40.b:0 "Create agencies to modernise farming equipment."
 hel_election.40.c:0 "Break the great estates and distribute the land."
 HEL_mainland_agriculture_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in the Mainland§!. This limited programme does not immediately alienate another region."
 HEL_mainland_agriculture_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in the Mainland§!.\n\nThis diverts public money from the cities: §R-2% support in Attica§! and §R-2% in Macedonia§!, while alienating §RSyndicalists§! nationally."
 HEL_mainland_agriculture_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in the Mainland§!.\n\nLandowners and urban taxpayers resist: §R-4% support in the Southern Aegean§!, §R-3% in Attica§!, and reduced §RMarket Liberal§! popularity."

 hel_election.41.t:0 "War Exhaustion in Attica"
 hel_election.41.desc:0 "Athens had furnished ministries, clerks, officers and conscripts for every campaign of the previous decade. Families wanted their sons returned, workers wanted emergency restrictions lifted and veterans wanted a peace worthy of their service. Demobilisation could answer them, but Greeks living beyond the old frontier feared that the army would leave before their future was secure."
 hel_election.41.a:0 "Publish a binding demobilisation calendar."
 hel_election.41.b:0 "Guarantee pensions and employment for veterans."
 hel_election.41.c:0 "End mobilisation and repeal the emergency controls."
 HEL_attica_exhaustion_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in Attica§!. The limited timetable avoids an immediate regional backlash."
 HEL_attica_exhaustion_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in Attica§!.\n\nIndustrial taxpayers object to its cost: §R-2% support in Macedonia§! and reduced §RMarket Liberal§! popularity."
 HEL_attica_exhaustion_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in Attica§!.\n\nFrontier settlers and officers fear abandonment: §R-4% support in Thrace and the Straits§!, §R-3% in Ionia§!, and reduced §RPaternalistic Authoritarian§! popularity."

 hel_election.42.t:0 "Liberty and Sea Power in the Southern Aegean"
 hel_election.42.desc:0 "The Morea remembered the arbitrary hand of the wartime state and demanded the restoration of local freedoms. Cyprus and the islands looked instead to the sea: without a modern navy, promises of protection and union meant little. Satisfying both demands would win a formidable bloc, but mainland taxpayers and Macedonian industry would carry much of the expense."
 hel_election.42.a:0 "Restore municipal liberties and civilian courts."
 hel_election.42.b:0 "Create an Aegean naval modernisation fund."
 hel_election.42.c:0 "Promise autonomy, courts and a modern fleet."
 HEL_aegean_freedom_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in the Southern Aegean§!. The limited restoration of liberties causes no immediate regional loss."
 HEL_aegean_navy_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in the Southern Aegean§!.\n\nThe naval appropriation is resented by inland taxpayers: §R-2% support in the Mainland§! and §R-2% in Macedonia§!."
 HEL_aegean_package_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in the Southern Aegean§!.\n\nCentralists and industrial taxpayers resist the package: §R-3% support in Attica§!, §R-4% in Macedonia§!, and §R-1% Stability§!."

 hel_election.43.t:0 "Reconstruction in Macedonia"
 hel_election.43.desc:0 "Macedonia had changed hands, absorbed refugees and supplied armies while its railways and workshops deteriorated. Voters wanted employment, reliable transport and credit enough to turn military production toward peace. Every drachma invested around Thessaloniki, however, was a drachma unavailable to farmers, islanders or the ministries in Athens."
 hel_election.43.a:0 "Repair the railways and commercial depots."
 hel_election.43.b:0 "Establish a Macedonian industrial credit bank."
 hel_election.43.c:0 "Fund worker-led reconstruction boards."
 HEL_macedonia_economy_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in Macedonia§!. Railway repair avoids an immediate regional backlash."
 HEL_macedonia_economy_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in Macedonia§!.\n\nRural borrowers and reformists distrust the industrial preference: §R-2% support in the Mainland§! and reduced §RSocial Democratic§! popularity."
 HEL_macedonia_economy_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in Macedonia§!.\n\nAthens and the islands fear both the expense and organised labour: §R-4% support in Attica§!, §R-3% in the Southern Aegean§!, and reduced §RMarket Liberal§! popularity."

 hel_election.empire.desc:0 "The voters here did not regard the empire as an abstraction. Their homes, property and safety depended upon whether Greece would defend, administer or abandon the settlement it had created. A cautious guarantee might reassure them. Permanent integration would win far more enthusiasm locally while deepening war exhaustion and resentment in old Greece."
 hel_election.44.t:0 "The Future of Thrace and the Straits"
 hel_election.44.a:0 "Guarantee the defence of the new frontier."
 hel_election.44.b:0 "Create an imperial customs and development zone."
 hel_election.44.c:0 "Promise permanent garrisons along the Straits."
 HEL_straits_empire_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in Thrace and the Straits§!, without an immediate loss elsewhere."
 HEL_straits_empire_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in Thrace and the Straits§!.\n\nMacedonian merchants oppose the customs preference: §R-2% support in Macedonia§!."
 HEL_straits_empire_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in Thrace and the Straits§!.\n\nPermanent military commitments cause §R-4% support in Attica§! and §R-3% in the Mainland§!, although they slightly increase War Support."

 hel_election.45.t:0 "What Future for Constantinople?"
 hel_election.45.a:0 "Seek international guarantees for Greek administration."
 hel_election.45.b:0 "Fund an imperial capital works programme."
 hel_election.45.c:0 "Declare Constantinople a permanent Hellenic capital."
 HEL_constantinople_empire_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in Constantinople§!, without an immediate loss elsewhere."
 HEL_constantinople_empire_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in Constantinople§!.\n\nAthenians resent investment in a rival capital: §R-2% support in Attica§!."
 HEL_constantinople_empire_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in Constantinople§!.\n\nOld Greece fears an imperial state: §R-4% support in Attica§!, §R-3% in the Mainland§!, and reduced §RClassical Liberal§! popularity."

 hel_election.46.t:0 "The Future of Ionia"
 hel_election.46.a:0 "Guarantee Greek land titles and local security."
 hel_election.46.b:0 "Finance Smyrna's port and commercial expansion."
 hel_election.46.c:0 "Promise Ionia's permanent annexation."
 HEL_ionia_empire_low_tt:0 "Spend §Y15 Political Power§! to gain §G+7% support in Ionia§!, without an immediate loss elsewhere."
 HEL_ionia_empire_medium_tt:0 "Spend §Y30 Political Power§! to gain §G+13% support in Ionia§!.\n\nMacedonian ports oppose Smyrna's preferential funding: §R-2% support in Macedonia§!."
 HEL_ionia_empire_high_tt:0 "Spend §Y50 Political Power§! to gain §G+20% support in Ionia§!.\n\nPermanent annexation intensifies war exhaustion: §R-4% support in Attica§!, §R-3% in the Mainland§!, and reduced §RSocial Democratic§! popularity."
 hel_election.campaign.skip:0 "Make no costly promise."
 hel_election.50.t:0 "The Deputies Name Their Price"
 hel_election.50.d:0 "The liberal deputies accept that the election may not preserve the order Venizelos built, but they will not sign away parliament without a guarantee. Some demand an early return to elections once the emergency has passed. Others ask for offices in the provisional cabinet, ensuring that the army cannot govern without civilian witnesses."
 hel_election.50.a:0 "Promise elections after the emergency."
 hel_election.50.b:0 "Reserve cabinet offices for their faction."
 hel_election.51.t:0 "The Officers Demand Guarantees"
 hel_election.51.d:0 "The officers approached by Plastiras have fought through a decade of campaigns and will not hazard their careers for an uncertain declaration. Senior men demand that wartime precedence be respected, while younger conspirators insist upon promotions and protection from any subsequent purge."
 hel_election.51.a:0 "Recognise wartime seniority."
 hel_election.51.b:0 "Guarantee the conspirators' commands."
 hel_election.52.t:0 "Terms from the Telegraph Offices"
 hel_election.52.d:0 "Telegraph employees can delay loyalist orders and carry Plastiras' messages across the country, but they know what their cooperation is worth. Union delegates ask for labour protections after the seizure of power. The supervisors instead seek immunity and money enough to disappear should the attempt fail."
 hel_election.52.a:0 "Promise protection to the telegraph unions."
 hel_election.52.b:0 "Purchase the supervisors' silence."
 hel_election.53.t:0 "The Price of the Athens Garrison"
 hel_election.53.d:0 "The Athens garrison will move when ordered, provided that the men who open the barracks are not abandoned. Its commanders ask for immunity from prosecution; ambitious captains press instead for immediate promotion and control of the capital's military administration."
 hel_election.53.a:0 "Grant the garrison blanket immunity."
 hel_election.53.b:0 "Promise accelerated promotions."
 hel_election.54.t:0 "The Parliamentary Wing Walks Out"
 hel_election.54.d:0 "Metaxas' ascendancy had become impossible for the parliamentary royalists to excuse. Deputies loyal to Gounaris denounced the opposition's capture by officers and street nationalists, withdrew their organisers and instructed sympathetic newspapers to campaign independently. The common front survived in name, but its machinery in Attica, the islands and Ionia had broken apart."
 hel_election.54.a:0 "The opposition has split."
 hel_election.55.t:0 "The Nationalist Wing Walks Out"
 hel_election.55.d:0 "Gounaris had reduced Metaxas and his followers to decorative partners in a parliamentary machine. Nationalist organisers accused the party leadership of betraying Dragoumis, abandoned the common campaign and carried sympathetic officers and provincial committees with them. The opposition retained its deputies, but lost much of its force across the mainland, Macedonia and the Straits."
 hel_election.55.a:0 "The opposition has split."
 hel_election.56.t:0 "Plastiras Overthrows the Government"
 hel_election.56.d:0 "Civilian authority had become a formality. Plastiras' officers controlled the barracks, the streets and the communications upon which Zaimis depended. Before the cabinet could dismiss them, troops occupied the ministries and surrounded parliament. Plastiras declared that the army had acted to preserve the territorial settlement, prevent national collapse and save the republic from politicians incapable of defending it."
 hel_election.56.a:0 "The officers have seized the republic."
 hel_election.region.d:0 "Party organisers can arrange a brief appearance, finance a serious tour or commit the full campaign apparatus to this region. Greater expenditure will bring a larger share of its parliamentary delegation."
 hel_election.region.5:0 "Spend £pol_power 5 on a brief appearance."
 hel_election.region.10:0 "Spend £pol_power 10 on a sustained tour."
 hel_election.region.15:0 "Spend £pol_power 15 on a full regional campaign."
 hel_election.region.skip:0 "Our resources are needed elsewhere."
