 HEL_campaign_in_region_desc:0 "Open a regional campaign from the map. Choosing the argument that matters locally produces the strongest result, while every national message also influences neighbouring races. The opposition may erase an unattended advantage."
 HEL_campaign_mainland:0 "Campaign Across the Mainland"
 HEL_campaign_mainland_desc:0 "One campaign covers both §YEpirus§! and §YThessaly§!. Hovering this mission highlights the complete six-seat Mainland race."
 HEL_campaign_attica_race:0 "Campaign in Attica"
 HEL_campaign_attica_race_desc:0 "Campaign throughout §YAttica§! for its eight-seat delegation."
 HEL_campaign_south_aegean:0 "Campaign Across the Southern Aegean"
 HEL_campaign_south_aegean_desc:0 "One campaign covers §Ythe Morea§! and §Ythe Islands§!, together forming a seven-seat race."
 HEL_campaign_macedonia_race:0 "Campaign Across Macedonia"
 HEL_campaign_macedonia_race_desc:0 "One campaign covers all three §YMacedonian§! states and their nine-seat delegation."
 HEL_campaign_straits:0 "Campaign Across Thrace and the Straits"
 HEL_campaign_straits_desc:0 "One campaign covers §YEastern Thrace§! and §Ythe Marmara§!. Constantinople remains a separate race."
 HEL_campaign_constantinople_race:0 "Campaign Across Constantinople"
 HEL_campaign_constantinople_race_desc:0 "Campaign throughout both §YConstantinople§! states for their six-seat delegation."
 HEL_campaign_ionia_race:0 "Campaign Across Ionia"
 HEL_campaign_ionia_race_desc:0 "One campaign covers all three §YIonian§! states and their six-seat delegation."
 HEL_royalist_direction_balance:0 "Direction of the Royalist Opposition"
 HEL_royalist_party_balance:0 "The Dragoumis Split"
 HEL_royalist_party_balance_desc:0 "Dragoumis' assassination threatens to tear the opposition apart. Keep the balance near the centre or one wing will abandon the common campaign."
 HEL_gounaris_side:0 "Gounaris and the Parliamentary Right"
 HEL_metaxas_side:0 "Metaxas and the Authoritarian Right"
 HEL_royalist_balance_deadlock:0 "A United Opposition"
 HEL_gounaris_influence:0 "Gounarist Influence"
 HEL_gounaris_ascendant:0 "Gounaris Ascendant"
 HEL_gounaris_dominant:0 "Gounaris Dominant"
 HEL_metaxas_influence:0 "Metaxist Influence"
 HEL_metaxas_ascendant:0 "Metaxas Ascendant"
 HEL_metaxas_dominant:0 "Metaxas Dominant"
 HEL_metaxas_direction_tt:0 "This strengthens §RMetaxas and the authoritarian wing§! within the royalist campaign."
 HEL_gounaris_direction_tt:0 "This strengthens §GGounaris and the parliamentary wing§! within the royalist campaign."
 HEL_dragoumis_shift_metaxas_tt:0 "The Dragoumis split begins. The balance moves sharply §Rtowards Metaxas§!. Letting either wing become dominant risks a party schism."
 HEL_dragoumis_shift_gounaris_tt:0 "The Dragoumis split begins. The balance moves §Gtowards Gounaris§!. Letting either wing become dominant risks a party schism."
 HEL_reassure_parliamentary_royalists:0 "Reassure the Parliamentary Royalists"
 HEL_reassure_parliamentary_royalists_desc:0 "Spend four days negotiating with Gounaris' deputies and draw the opposition back towards its parliamentary wing."
 HEL_reassure_nationalist_royalists:0 "Reassure the Nationalist Royalists"
 HEL_reassure_nationalist_royalists_desc:0 "Spend four days making guarantees to Metaxas' organisers and draw the opposition back towards its authoritarian wing."
 HEL_republican_direction_balance:0 "Civilian Authority and the Officer Corps"
 HEL_republican_party_balance:0 "The Zaimis–Plastiras Understanding"
 HEL_republican_party_balance_desc:0 "Zaimis keeps the civilian republic together only through continued negotiation with Plastiras and his officers. §RIf Plastiras reaches 70% influence, he will immediately overthrow the civilian government.§!"
 HEL_zaimis_side:0 "Zaimis and Civilian Government"
 HEL_plastiras_side:0 "Plastiras and the Officer Corps"
 HEL_republican_balance_cooperation:0 "Civil–Military Cooperation"
 HEL_zaimis_influence:0 "Civilian Authority"
 HEL_zaimis_ascendant:0 "Zaimis Ascendant"
 HEL_plastiras_influence:0 "Military Influence"
 HEL_plastiras_coup_imminent:0 "A Coup is Imminent"
 HEL_plastiras_coup_threshold:0 "Plastiras Seizes Power"
 HEL_strengthen_zaimis_cabinet:0 "Strengthen the Civilian Cabinet"
 HEL_strengthen_zaimis_cabinet_desc:0 "Spend four days transferring emergency authority back to Zaimis' ministers and away from officers answerable to Plastiras."
 HEL_concede_to_plastiras_officers:0 "Concede Authority to Plastiras' Officers"
 HEL_concede_to_plastiras_officers_desc:0 "Spend four days granting Plastiras' circle greater authority over security and the election. This decision is disabled before it can itself cross the coup threshold."
 HEL_republican_balance_created_tt:0 "Talks will continue and create a §YBalance of Power§! between Zaimis and Plastiras.\n\n§RIf Plastiras reaches 70% influence, he will immediately coup the civilian government.§!"
 HEL_zaimis_balance_decision_tt:0 "Moves the balance §G12% towards Zaimis§!.\n\n§RPlastiras will launch a coup if his influence ever reaches 70%.§!"
 HEL_plastiras_balance_decision_tt:0 "Moves the balance §R12% towards Plastiras§!.\n\n§RAt 70% Plastiras influence, the civilian government is immediately overthrown.§!"
 HEL_murder_condemnation_plastiras_tt:0 "Publicly condemning the murder gives Plastiras and the officer corps the initiative, moving the balance §R45% towards Plastiras§!.\n\n§RPlastiras will coup the government if his influence reaches 70%.§!"
 HEL_murder_defence_zaimis_tt:0 "Defending the existing settlement keeps the response under civilian control, moving the balance §G15% towards Zaimis§!.\n\n§RPlastiras will coup the government if his influence reaches 70%.§!"
 HEL_plastiras_intervention:0 "Plastiras' Intervention"
 HEL_plastiras_intervention_desc:0 "Plastiras must assemble fifty preparation points before the authorities uncover his plans. Only §Ytwo operations§! may proceed simultaneously, and every success will demand a political concession. Present preparation: §Y[?HEL_plastiras_preparation|0]§!/§Y50§!."
