l_english:
 ee_russian_debug_scenarios:0 "Russian Civil-War Debug Scenarios"
 ee_russian_debug_scenarios_desc:0 "Player-only switches for testing alternate revolutionary conflicts in Russia and Belarus. The AI can never select these decisions."

 SOV_debug_left_sr_revolt:0 "DEBUG: Trigger the Left SR Revolt"
 SOV_debug_left_sr_revolt_desc:0 "Maria Spiridonova and the Left Socialist-Revolutionaries seize one connected eleven-state Volga corridor, never including Moscow. Creates a separate light-pink LIBSOC belligerent even during another civil war. §RThe AI can never take this decision.§!"
 SOV_debug_tambov_revolt:0 "DEBUG: Trigger the Tambov Revolt"
 SOV_debug_tambov_revolt_desc:0 "Aleksandr Antonov's Working Peasants rise in Tambov, Ryazan, Penza, Lipetsk and Voronezh. Creates a moderately light-green SOCDEM civil-war faction. §RThe AI can never take this decision.§!"
 SOV_debug_steppe_kossack_revolt:0 "DEBUG: Trigger the Steppe Kossack Revolt"
 SOV_debug_steppe_kossack_revolt_desc:0 "Create a Steppe Kossack uprising across the southern SOV states. If the revolt is still fighting after 100 days, DON absorbs the Kossack country, receives its cores and army, and enters the war against SOV. §RThe AI can never take this decision.§!"
 PET_debug_kronstadt_rebellion:0 "DEBUG: Trigger the Kronstadt Rebellion"
 PET_debug_kronstadt_rebellion_desc:0 "Stepan Petrichenko and the revolutionary sailors rebel against Lenin across Petrograd and the north-western PET territories. §RThe AI can never take this decision.§!"
 PET_debug_tukhachevsky_betrayal:0 "DEBUG: Trigger Tukhachevsky's Betrayal"
 PET_debug_tukhachevsky_betrayal_desc:0 "Turn Belarus into Mikhail Tukhachevsky's Minsk Socialist Directory, give it cores on PET-controlled territory and declare war on PET. §RThe AI can never take this decision.§!"
 BLR_debug_minsk_socialist_directory:0 "DEBUG: Proclaim the Minsk Socialist Directory"
 BLR_debug_minsk_socialist_directory_desc:0 "Place Mikhail Tukhachevsky and the communist Socialist Directory in power, grant Belarus cores on every territory controlled by PET, and immediately declare war on the Petrograd Soviet. §RThe AI can never take this decision.§!"
 SOV_debug_all_russian_revolts:0 "DEBUG: Trigger Three-Way SOV Civil War"
 SOV_debug_all_russian_revolts_desc:0 "Create Tambov in its fixed five states and the Left SRs in a separate, connected eleven-state Volga corridor. SOV, Tambov and the Left SRs all fight one another; Moscow always remains with SOV. §RThe AI can never take this decision.§!"
 PET_debug_all_northern_revolts:0 "DEBUG: Trigger Three-Way PET Civil War"
 PET_debug_all_northern_revolts_desc:0 "Create Kronstadt and proclaim Tukhachevsky's Minsk Socialist Directory, with all three sides at war against one another. §RThe AI can never take this decision.§!"
 EE_debug_annex_rebel_opponents:0 "DEBUG: Annex the Rebel Side"
 EE_debug_annex_rebel_opponents_desc:0 "Immediately annex every active debug rebel currently at war with this government. This ends those wars directly and bypasses the peace conference. §RThe AI can never take this decision.§!"
 EE_debug_rebel_annex_parent:0 "DEBUG: Annex the Parent Government"
 EE_debug_rebel_annex_parent_desc:0 "Immediately annex the SOV or PET parent government fighting this debug rebel. This ends the war directly and bypasses the peace conference. §RThe AI can never take this decision.§!"

