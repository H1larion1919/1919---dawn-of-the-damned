 HEL_revenge_for_1453:0 "Revenge for 1453"
 HEL_revenge_for_1453_desc:0 "The fall of the Ottoman state has turned an old national dream into a military program. Greek forces have pushed through Thrace, struck Gallipoli from the north and landed along the Anatolian coast; for Athens, 1453 is no longer just a memory but a debt history may finally be forced to pay."
 HEL_scars_from_national_schism:0 "Scars from the National Schism"
 HEL_scars_from_national_schism_desc:0 "The Provisional Government of National Defence began in Thessaloniki under Venizelos, but victory came through insurrection, an army coup in Athens and the exile of Constantine to Sardinia. Greece enters 1919 enlarged and triumphant, yet every ministry, barracks and newspaper still feels the old rupture."
 HEL_a_decade_of_war:0 "A Decade of War"
 HEL_a_decade_of_war_desc:0 "From the Balkan struggle to Gallipoli, Thrace and the Anatolian landings, the republic has spent nearly a generation under arms. Its soldiers are experienced and its officers ambitious, but every new mobilization cuts into villages, ports and workshops already worn thin by war."
 HEL_age_of_venizelos:0 "The Age of Venizelos"
 HEL_age_of_venizelos_desc:0 "Eleftherios Venizelos has become the architect of the victorious republic: leader of National Defence, enemy of the old court and the politician who tied Greek ambition to British naval power. Under his shadow, the Megali Idea feels less like rhetoric and more like state policy."
 HEL_both_sides_of_the_shore:0 "Both Sides of the Shore"
 HEL_both_sides_of_the_shore_desc:0 "Greco-British naval dominance opened the Aegean, and Greek landings at Smyrna, Ephesus and Manissa have bound the republic to both shores. Ports, settlers, soldiers and administrators now move across the sea as if it were an internal road rather than a frontier."
 HEL_constantinople_smyrna_highway_spirit:0 "Constantinople-Smyrna Highway"
 HEL_constantinople_smyrna_highway_spirit_desc:0 "The new artery of the Hellenic republic binds the Aegean shore, the Bosporus and the Queen of Cities into one strategic system of rails, depots and workshops."
 HEL_hellas_of_two_continents_and_five_seas:0 "Hellas, of 2 Continents and 5 Seas"
 HEL_hellas_of_two_continents_and_five_seas_desc:0 "Greece has triumphed over its foes, emerging as the undisputed victor of the region. She has set foot once more on the shores of Troy like her Achaean ancestors, and, controlling the Queen of Cities, rests in the sweet embrace of the Aegean. Spanning across Europe and Asia, the republic is bathed by five seas: the Ionian, Aegean, Bosporus, Black, and Eastern Mediterranean. Despite the costs, our lads have fought a historic battle and fulfilled their duty to their people and civilization."
 HEL_address_the_nation:0 "Address the Nation"
 HEL_address_the_nation_desc:0 "Prime minister E. Venizelos, acting with temporary crisis powers is announcing that he will be resigning and will be setting up the infrastrcture needed in order for true democratic elections to go underway. He plans to interconnect the new regions into one common Pan-Hellenic system guided through the iron will of modernisation."
 HEL_slowly_lift_mobilisation:0 "Slowly Lift Mobilisation"
 HEL_slowly_lift_mobilisation_desc:0 "Greece has plunged herself into non stop wars ever since 1912. It's time to send our lads home. To be reunited with their families as heroes of this grand Hellenic nation"
 HEL_integrate_ionia_and_bosporus:0 "Integrate Ionia and the Bosporus"
 HEL_integrate_ionia_and_bosporus_desc:0 "The lands of Ionia and the straits cannot remain trophies on a map. Their harbours, markets and villages must be woven into the civic body of Hellas, with Greek administration, schools, tax offices and workshops binding shore to shore under one republic."
 HEL_set_rule_of_law_in_new_cities:0 "Set the Rule of Law in the New Cities"
 HEL_set_rule_of_law_in_new_cities_desc:0 "These people were used to  the barbaric savagery of the sublime porte, where law was heresay and corrupt. Now, it is not the Qur'an which is the highest arbiter but the Greek constitution and the Greek civic code, which will enforce peace, tranquility and stability in the cities"
 HEL_constantinople_smyrna_highway:0 "Constantinople-Smyrna Highway"
 HEL_constantinople_smyrna_highway_desc:0 "From Smyrna to Constantinople, the republic must prove that liberation is more than flags and speeches. Steel rails, military roads and supply depots will make the Asian shore governable, defensible and prosperous, turning the old imperial corridors toward Athens."
 HEL_end_martial_law:0 "End Martial Law"
 HEL_end_martial_law_desc:0 "Greece shall no longer be governed under the iron fist of the militaries terror. From now on, personal freedoms, liberties and rights are to be restored, as God wished for them."
 HEL_set_up_election_infrastructure:0 "Set Up Election Infrastructure"
 HEL_set_up_election_infrastructure_desc:0 "as the retirement of Venizelos comes soon, it is time to begin setting up poling boxes and counting stations and ensure neutrality"
 HEL_retirement_of_ethnarch_venizelos:0 "The Retirement of the Ethnarch Venizelos"
 HEL_retirement_of_ethnarch_venizelos_desc:0 "Venizelos has carried Greece through victories that will fill schoolbooks for a century, but no republic can live forever in the shadow of one exhausted statesman. His retirement from crisis powers will test whether the nation he enlarged can also govern itself."
 HEL_1919_elections_ahead:0 "The 1919 Elections Ahead..."
 HEL_1919_elections_ahead_desc:0 "As Greece lays victorious, and her leader, exhausted, retires. It is time for the people of the nation to let history take it's course and decide for itself it's future vision for Greece."
